name: Mika Dev release API verification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release_api:
    if: github.repository == 'EvanDbg/Mika' && github.ref == 'refs/heads/automation/release-api-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify release APIs with a temporary draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/fork/probe_release_api.py
